# Pixel Clash Claude box: one container per seat (plan §11.1).
#
#   cp .env.example .env    # then edit PIXEL_CLASH_URL and the eight TTYD_PASS_N words
#   docker compose up -d --build                          # all 8 seats
#   docker compose up -d --build seat1 seat2 seat3        # or only the seats in use
#
# Seat N (1-8) is http://<claude-box>:768N (basic auth: player / TTYD_PASS_N).
# See README.md for the pre-event login, resets and the wipe.

name: pixel-clash-seats

x-seat: &seat
  build:
    # Repo root, so packages/starter-kit is in the build context. The builder
    # only receives what sessions/Dockerfile.dockerignore allows.
    context: ..
    dockerfile: sessions/Dockerfile
  image: pixel-clash-seat:local
  init: true # tini as PID 1: reaps the claude processes ttyd spawns
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  # Limits, not reservations. One Claude Code process typically uses well
  # under 1 GB and under 1 core; 8 seats x 1.5 GB still leaves ~4 GB for the
  # host on a 16 GB box (README "Sizing").
  mem_limit: 1536m
  memswap_limit: 1536m
  cpus: 1.0
  pids_limit: 512
  stop_grace_period: 5s

x-seat-env: &seat-env
  PIXEL_CLASH_URL: ${PIXEL_CLASH_URL:?set PIXEL_CLASH_URL in sessions/.env}
  TTYD_USER: player
  CLAUDE_PERMISSION_MODE: ${CLAUDE_PERMISSION_MODE:-}
  CLAUDE_CONTINUE: ${CLAUDE_CONTINUE:-1}

services:
  seat1:
    <<: *seat
    hostname: seat1
    environment:
      <<: *seat-env
      SEAT: "1"
      TTYD_PASS: ${TTYD_PASS_1:?set TTYD_PASS_1 in sessions/.env}
    ports: ["7681:7681"]
    volumes:
      - kit1:/kit
      - claude1:/home/player/.claude

  seat2:
    <<: *seat
    hostname: seat2
    environment:
      <<: *seat-env
      SEAT: "2"
      TTYD_PASS: ${TTYD_PASS_2:?set TTYD_PASS_2 in sessions/.env}
    ports: ["7682:7681"]
    volumes:
      - kit2:/kit
      - claude2:/home/player/.claude

  seat3:
    <<: *seat
    hostname: seat3
    environment:
      <<: *seat-env
      SEAT: "3"
      TTYD_PASS: ${TTYD_PASS_3:?set TTYD_PASS_3 in sessions/.env}
    ports: ["7683:7681"]
    volumes:
      - kit3:/kit
      - claude3:/home/player/.claude

  seat4:
    <<: *seat
    hostname: seat4
    environment:
      <<: *seat-env
      SEAT: "4"
      TTYD_PASS: ${TTYD_PASS_4:?set TTYD_PASS_4 in sessions/.env}
    ports: ["7684:7681"]
    volumes:
      - kit4:/kit
      - claude4:/home/player/.claude

  seat5:
    <<: *seat
    hostname: seat5
    environment:
      <<: *seat-env
      SEAT: "5"
      TTYD_PASS: ${TTYD_PASS_5:?set TTYD_PASS_5 in sessions/.env}
    ports: ["7685:7681"]
    volumes:
      - kit5:/kit
      - claude5:/home/player/.claude

  seat6:
    <<: *seat
    hostname: seat6
    environment:
      <<: *seat-env
      SEAT: "6"
      TTYD_PASS: ${TTYD_PASS_6:?set TTYD_PASS_6 in sessions/.env}
    ports: ["7686:7681"]
    volumes:
      - kit6:/kit
      - claude6:/home/player/.claude

  seat7:
    <<: *seat
    hostname: seat7
    environment:
      <<: *seat-env
      SEAT: "7"
      TTYD_PASS: ${TTYD_PASS_7:?set TTYD_PASS_7 in sessions/.env}
    ports: ["7687:7681"]
    volumes:
      - kit7:/kit
      - claude7:/home/player/.claude

  seat8:
    <<: *seat
    hostname: seat8
    environment:
      <<: *seat-env
      SEAT: "8"
      TTYD_PASS: ${TTYD_PASS_8:?set TTYD_PASS_8 in sessions/.env}
    ports: ["7688:7681"]
    volumes:
      - kit8:/kit
      - claude8:/home/player/.claude

networks:
  default:
    # A fixed Linux bridge name, so the optional egress firewall in README.md
    # can match "-i pcseats". Ignored by Docker Desktop.
    driver_opts:
      com.docker.network.bridge.name: pcseats

# Named volumes only: no host paths, no Docker socket.
# `docker compose down -v` deletes them all (kits, keys, chat history, logins).
volumes:
  kit1:
  kit2:
  kit3:
  kit4:
  kit5:
  kit6:
  kit7:
  kit8:
  claude1:
  claude2:
  claude3:
  claude4:
  claude5:
  claude6:
  claude7:
  claude8:
