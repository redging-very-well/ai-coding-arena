# Pixel Clash Claude box: one container per seat (plan §11.1).
#
#   cp .env.example .env    # then edit PIXEL_CLASH_URL and SEAT_SECRET
#   docker compose up -d --build                          # all 8 seats
#   docker compose up -d --build seat1 seat2 seat3        # or only the seats in use
#
# Players reach seat N (1-8) through the game server's proxy, inside /play
# (/terminal/N/). Directly (adults' fallback): http://<claude-box>:778N/terminal/N/
# with basic auth player / SEAT_SECRET. Enter the same SEAT_SECRET in
# /admin -> Claude seats. See README.md for the login, resets, firewall and wipe.

name: pixel-clash-seats

x-seat: &seat
  build:
    # Repo root, so packages/starter-kit is in the build context. The builder
    # only receives what sessions/Dockerfile.dockerignore allows.
    context: ..
    dockerfile: sessions/Dockerfile
  image: pixel-clash-seat:local
  # Always (re)build on `up`, so a plain `docker compose up -d` can't keep
  # running an image built from older sessions/ files (e.g. the old ttyd
  # port or base path). Layers are cached, so this is quick after the first build.
  pull_policy: build
  init: true # tini as PID 1: reaps the claude / codex processes ttyd spawns
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  # Limits, not reservations. One Claude Code (or Codex) process typically uses well
  # under 1 GB and under 1 core; 8 seats x 1.5 GB still leaves ~4 GB for the
  # host on a 16 GB box (README "Sizing").
  mem_limit: 1536m
  memswap_limit: 1536m
  cpus: 1.0
  pids_limit: 512
  stop_grace_period: 5s

x-seat-env: &seat-env
  PIXEL_CLASH_URL: ${PIXEL_CLASH_URL:?set PIXEL_CLASH_URL in sessions/.env}
  TTYD_USER: player
  # One shared seat password for all 8 seats (plan §11.2). The game server's
  # proxy injects it; players never see it. Old TTYD_PASS_N lines are ignored.
  TTYD_PASS: ${SEAT_SECRET:?set SEAT_SECRET in sessions/.env}
  CLAUDE_PERMISSION_MODE: ${CLAUDE_PERMISSION_MODE:-}
  CLAUDE_CONTINUE: ${CLAUDE_CONTINUE:-1}
  # Which coding agent the seats run: claude (default) or codex (§11.3).
  # SEAT_AGENT_N in .env overrides it for seat N (set per seat below).
  AGENT: ${AGENT:-claude}
  CODEX_SANDBOX: ${CODEX_SANDBOX:-danger-full-access}
  CODEX_APPROVAL: ${CODEX_APPROVAL:-never}
  # Optional: Codex seats that aren't logged in yet log in with this key on
  # start. The entrypoint unsets it before Codex runs.
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

services:
  seat1:
    <<: *seat
    hostname: seat1
    environment:
      <<: *seat-env
      SEAT: "1"
      SEAT_AGENT: ${SEAT_AGENT_1:-}
    ports: ["7781:7781"]
    volumes:
      - kit1:/kit
      - claude1:/home/player/.claude
      - codex1:/home/player/.codex

  seat2:
    <<: *seat
    hostname: seat2
    environment:
      <<: *seat-env
      SEAT: "2"
      SEAT_AGENT: ${SEAT_AGENT_2:-}
    ports: ["7782:7781"]
    volumes:
      - kit2:/kit
      - claude2:/home/player/.claude
      - codex2:/home/player/.codex

  seat3:
    <<: *seat
    hostname: seat3
    environment:
      <<: *seat-env
      SEAT: "3"
      SEAT_AGENT: ${SEAT_AGENT_3:-}
    ports: ["7783:7781"]
    volumes:
      - kit3:/kit
      - claude3:/home/player/.claude
      - codex3:/home/player/.codex

  seat4:
    <<: *seat
    hostname: seat4
    environment:
      <<: *seat-env
      SEAT: "4"
      SEAT_AGENT: ${SEAT_AGENT_4:-}
    ports: ["7784:7781"]
    volumes:
      - kit4:/kit
      - claude4:/home/player/.claude
      - codex4:/home/player/.codex

  seat5:
    <<: *seat
    hostname: seat5
    environment:
      <<: *seat-env
      SEAT: "5"
      SEAT_AGENT: ${SEAT_AGENT_5:-}
    ports: ["7785:7781"]
    volumes:
      - kit5:/kit
      - claude5:/home/player/.claude
      - codex5:/home/player/.codex

  seat6:
    <<: *seat
    hostname: seat6
    environment:
      <<: *seat-env
      SEAT: "6"
      SEAT_AGENT: ${SEAT_AGENT_6:-}
    ports: ["7786:7781"]
    volumes:
      - kit6:/kit
      - claude6:/home/player/.claude
      - codex6:/home/player/.codex

  seat7:
    <<: *seat
    hostname: seat7
    environment:
      <<: *seat-env
      SEAT: "7"
      SEAT_AGENT: ${SEAT_AGENT_7:-}
    ports: ["7787:7781"]
    volumes:
      - kit7:/kit
      - claude7:/home/player/.claude
      - codex7:/home/player/.codex

  seat8:
    <<: *seat
    hostname: seat8
    environment:
      <<: *seat-env
      SEAT: "8"
      SEAT_AGENT: ${SEAT_AGENT_8:-}
    ports: ["7788:7781"]
    volumes:
      - kit8:/kit
      - claude8:/home/player/.claude
      - codex8:/home/player/.codex

networks:
  default:
    # A fixed Linux bridge name, so the optional egress firewall in README.md
    # can match "-i pcseats". Ignored by Docker Desktop.
    driver_opts:
      com.docker.network.bridge.name: pcseats

# Named volumes only: no host paths, no Docker socket.
# `docker compose down -v` deletes them all (kits, keys, chat history, logins).
volumes:
  kit1:
  kit2:
  kit3:
  kit4:
  kit5:
  kit6:
  kit7:
  kit8:
  claude1:
  claude2:
  claude3:
  claude4:
  claude5:
  claude6:
  claude7:
  claude8:
  codex1:
  codex2:
  codex3:
  codex4:
  codex5:
  codex6:
  codex7:
  codex8:
